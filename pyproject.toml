[project]
name = "lstm-autoencoder"
version = "0.1.0"
description = "LSTM Autoencoder with Attention"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "ruff>=0.17.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[project.scripts]
lstm-autoencoder = "lstm_autoencoder:main"

[project.urls]
Homepage = "https://github.com/abyalax/LSTM-Autoencoder-with-Attention"
Repository = "https://github.com/abyalax/LSTM-Autoencoder-with-Attention.git"
Issues = "https://github.com/abyalax/LSTM-Autoencoder-with-Attention/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lstm_autoencoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
